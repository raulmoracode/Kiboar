# Local PostgreSQL for the Medusa service. The defaults match
# shop/.env.template: postgres://kiboar:kiboar@localhost:5432/kiboar-shop
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kiboar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiboar}
      POSTGRES_DB: ${POSTGRES_DB:-kiboar-shop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kiboar} -d ${POSTGRES_DB:-kiboar-shop}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
