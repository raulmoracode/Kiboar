packages:
  - "docs"
  - "software/app"
  - "software/packages/*"
  - "packages/*"
  - "web"
  - "shop"
  - "shop/storefront"

# A new dependency must be at least a day old before it can be resolved.
# Writing the value enables strict enforcement; see CONTRIBUTING.md.
minimumReleaseAge: 1440

allowBuilds:
  "@medusajs/telemetry": false
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true

catalog:
  "@playwright/test": ^1.65.1
  "@tailwindcss/vite": ^4.3.5
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  "@vitejs/plugin-react": ^6.3.0
  "@types/node": ^22.0.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  axe-core: ^4.14.1
  jsdom: ^26.1.0
  lucide-react: ^1.73.0
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.5
  typescript: ^7.0.2
  vite: ^8.3.8
  vitest: ^5.1.1
  zod: ^4.6.7
