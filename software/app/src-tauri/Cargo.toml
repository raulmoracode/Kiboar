[package]
name = "kiboar-studio"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nusb = "0.2"
hidapi = "2"
thiserror = "2"
kiboar-device = { path = "../../crates/kiboar-device" }
kiboar-flash = { path = "../../crates/kiboar-flash" }
ts-rs = "12"

[dev-dependencies]
tempfile = "3"
