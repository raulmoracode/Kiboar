name: CI

on:
  push:
    branches: [main]
    paths:
      - "library/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "NOTICE"
      - "LICENSE"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "library/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "NOTICE"
      - "LICENSE"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the library gate
        run: pnpm library

  kicad:
    name: KiCad 10 format and render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: kicad/kicad:10.0.8
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: KiCad version
        run: kicad-cli version

      - name: Library is saved in the current format
        run: |
          work=$(mktemp -d)
          cp -R library/footprints "$work/"
          cp library/symbols/Kiboar.kicad_sym "$work/symbols.kicad_sym"

          kicad-cli sym upgrade "$work/symbols.kicad_sym"
          for library in "$work"/footprints/*.pretty; do
            kicad-cli fp upgrade "$library"
          done

          status=0
          diff -r library/footprints "$work/footprints" || status=1
          cmp -s library/symbols/Kiboar.kicad_sym "$work/symbols.kicad_sym" || status=1
          if [ "$status" -ne 0 ]; then
            echo "::error::KiCad would upgrade the library; commit the upgraded files"
            exit 1
          fi

      - name: Render a sample footprint and symbol
        run: |
          mkdir -p artifacts
          kicad-cli fp export svg -o artifacts library/footprints/Kiboar_SlideSwitch.pretty --fp EG1215AA
          kicad-cli sym export svg -o artifacts library/symbols/Kiboar.kicad_sym --symbol SWITCH_EG1215AA

      - name: Upload the sample SVGs
        uses: actions/upload-artifact@v7
        with:
          name: sample-svg
          path: artifacts/
          if-no-files-found: error
