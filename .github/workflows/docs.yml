name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "library/footprints/**"
      - "library/tools/**"
      - "library/3dmodels/**"
      - ".npmrc"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "package.json"
      - ".node-version"
      - "biome.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "library/footprints/**"
      - "library/tools/**"
      - "library/3dmodels/**"
      - ".npmrc"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "package.json"
      - ".node-version"
      - "biome.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache the Turbo outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint:docs

      - name: Generated pages are current
        run: python3 library/tools/gen_docs.py --check

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=kiboar-docs

      - name: Build
        run: pnpm turbo run build --filter=kiboar-docs

      - name: Output exists
        run: test -f docs/dist/docs/index.html

      - name: Unit tests
        run: pnpm --filter kiboar-docs test

      - name: Install Chromium
        run: pnpm --filter kiboar-docs exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter kiboar-docs test:e2e
