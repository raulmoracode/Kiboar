name: Studio release

on:
  workflow_dispatch:
  push:
    tags:
      - "studio-v*"

permissions:
  contents: write

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: software

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test before packaging
        run: |
          pnpm lint
          pnpm turbo run typecheck test build --filter=@kiboar/core --filter=@kiboar/studio
          cargo test --locked --manifest-path software/Cargo.toml --workspace

      - name: Check the tag matches the versions
        if: startsWith(github.ref, 'refs/tags/studio-v')
        run: |
          tag="${GITHUB_REF_NAME#studio-v}"
          app="$(node -p "require('./software/app/package.json').version")"
          tauri="$(node -p "require('./software/app/src-tauri/tauri.conf.json').version")"
          cargo="$(sed -n 's/^version = "\(.*\)"/\1/p' software/app/src-tauri/Cargo.toml | head -n 1)"
          for version in "$app" "$tauri" "$cargo"; do
            [ "$version" = "$tag" ] || { echo "::error::version $version does not match tag $tag"; exit 1; }
          done

      - name: Build the universal bundle
        run: pnpm --filter @kiboar/studio tauri build --target universal-apple-darwin

      - name: Normalise and checksum
        run: |
          cd software/target/universal-apple-darwin/release/bundle/dmg
          for dmg in *.dmg; do
            safe="$(printf '%s' "$dmg" | tr ' ' '.')"
            [ "$dmg" = "$safe" ] || mv "$dmg" "$safe"
          done
          shasum -a 256 *.dmg > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: kiboar-studio-macos
          path: |
            software/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            software/target/universal-apple-darwin/release/bundle/dmg/SHA256SUMS
          if-no-files-found: error

      - name: Publish the pre-release
        if: startsWith(github.ref, 'refs/tags/studio-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            software/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            software/target/universal-apple-darwin/release/bundle/dmg/SHA256SUMS
