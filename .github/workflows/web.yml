name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/**"
      - ".npmrc"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "package.json"
      - ".node-version"
      - "biome.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "packages/**"
      - ".npmrc"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "package.json"
      - ".node-version"
      - "biome.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome check web

      - name: Typecheck and build
        run: |
          pnpm --filter @kiboar/web typecheck
          pnpm --filter @kiboar/web build

      - name: Test
        run: pnpm --filter @kiboar/web test

      - name: Install Chromium
        run: pnpm --filter @kiboar/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @kiboar/web test:e2e
