name: Security

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "software/Cargo.lock"
      - "software/Cargo.toml"
      - "software/deny.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "software/Cargo.lock"
      - "software/Cargo.toml"
      - "software/deny.toml"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit the production dependencies
        run: pnpm audit --prod --audit-level high

  cargo:
    name: Cargo advisories and licences
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@cargo-deny

      - name: Check advisories, licences, bans and sources
        run: cargo deny check
