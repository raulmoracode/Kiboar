name: Software

on:
  push:
    branches: [main]
    paths:
      - "software/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "package.json"
      - ".node-version"
      - "rust-toolchain.toml"
      - "biome.json"
      - "rustfmt.toml"
      - ".github/workflows/software.yml"
  pull_request:
    paths:
      - "software/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "package.json"
      - ".node-version"
      - "rust-toolchain.toml"
      - "biome.json"
      - "rustfmt.toml"
      - ".github/workflows/software.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: software-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Schemas and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint:studio

      - name: Typecheck and test
        run: pnpm turbo run typecheck test --filter=@kiboar/core --filter=@kiboar/studio

      - name: Schemas are current
        run: |
          pnpm schema:export
          git diff --exit-code -- software/schemas

      - name: Build Studio
        run: pnpm turbo run build --filter=@kiboar/studio

  rust:
    name: Rust and bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri and HID system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: software

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and build the frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@kiboar/studio

      - name: Rust format and lints
        run: |
          cargo fmt --manifest-path software/Cargo.toml --all -- --check
          cargo clippy --manifest-path software/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path software/Cargo.toml -p kiboar-device

      - name: TypeScript bindings are current
        run: git diff --exit-code -- software/app/src/lib/bindings

      - name: Tauri shell checks
        run: cargo check --locked --manifest-path software/Cargo.toml -p kiboar-studio
