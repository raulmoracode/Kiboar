name: Bug report
description: Report a problem with a symbol, footprint, 3D model or the tools
title: "fix: "
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please check the
        existing issues first; if one already describes it, add your details
        there instead.

  - type: input
    id: kicad_version
    attributes:
      label: KiCad version
      description: Help → About KiCad → Copy version information
      placeholder: "10.0.8"
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: "macOS 15.6, Windows 11, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: item
    attributes:
      label: Library and item
      description: The footprint or symbol name as it appears in the library
      placeholder: "Kiboar_MechSwitch / EG1215AA, or SWITCH_EG1215AA"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order
      placeholder: |
        1. Open the PCB editor with a board using Kiboar
        2. Place Kiboar_MechSwitch:EG1215AA
        3. Run the design rules checker
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happens
      description: Include the exact DRC or ERC message when there is one
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or files
      description: Drag in images, a minimal board or the text of a log
    validations:
      required: false
