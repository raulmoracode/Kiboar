name: Component request
description: Ask for a component to be added to the library
title: "feat: "
labels: ["type:feat"]
body:
  - type: markdown
    attributes:
      value: |
        A request is much easier to act on with a manufacturer part number and
        a datasheet. If you can also supply a footprint, symbol or 3D model,
        say so below.

  - type: input
    id: manufacturer
    attributes:
      label: Manufacturer
      placeholder: "Alps Alpine"
    validations:
      required: true

  - type: input
    id: mpn
    attributes:
      label: Manufacturer part number
      placeholder: "SKTHBAE010"
    validations:
      required: true

  - type: input
    id: kind
    attributes:
      label: Component type
      description: Switch, encoder, connector, controller board, LED, other
      placeholder: "Tactile switch"
    validations:
      required: true

  - type: input
    id: datasheet
    attributes:
      label: Datasheet URL
      placeholder: "https://www.alpsalpine.com/e/products/detail/SKTHBAE010/"
    validations:
      required: true

  - type: input
    id: purchase
    attributes:
      label: Purchase link
      description: A distributor page with stock, for verification
      placeholder: "https://www.mouser.com/ProductDetail/..."
    validations:
      required: false

  - type: input
    id: model
    attributes:
      label: 3D model link
      description: STEP or WRL from the manufacturer, if one exists
      placeholder: "https://www.alpsalpine.com/..."
    validations:
      required: false

  - type: textarea
    id: reason
    attributes:
      label: Why should this be in Kiboar?
      description: What it is used for on a keyboard and what it replaces
    validations:
      required: true

  - type: textarea
    id: offer
    attributes:
      label: Can you contribute the files?
      description: Footprint, symbol, 3D model or the dimensions from the datasheet
    validations:
      required: false
